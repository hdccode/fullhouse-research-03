# FHR3A controlled table-size suite: 8-max NLHE 100BB (suite = 3 / 4 / 6 / 8 seats).
# Table size is the only changed variable across the suite. All four configs share the variant,
# 100BB stack, blinds, root seed, RNG coupling/salts, candidate specs, p1/p2/p3/c0 pairings and
# ONE marginal reference population, applied by a deterministic block schedule:
#     reference in relative slot j of block b = cycle[(b + j) mod 5]
#     cycle = [neutral, neutral, tight, loose, aggressive]  -> 40 / 20 / 20 / 20 %
# Every relative slot sees exactly that mixture over any 5 consecutive blocks; A and B always
# face the same lineup within a block. See docs/table_size.md.
# Distinct from the frozen fhr3-nlhe4-100bb-v2 / fhr3-nlhe6-100bb-pilot-v1 corpora (their fixed
# populations change with table size); those are only a separate historical comparison.
# Block = candidate in each of the 8 seats x sides A/B = 16 played hands.
# Publication target: p1-p3 at 30,000 blocks, c0 at 10,000 (scripts/run_table_size.sh).
# Scientific fields (experiment_id, root_seed, game, rng, agents used by a
# pairing) are hashed; blocks / chunk_size / trace are operational.
experiment_id: fhr3a-nlhe8-100bb-tablesize-v1
root_seed: 20260928

game:
  variant: nlhe
  player_count: 8
  stack_bb: 100
  bb_chips: 100
  sb_chips: 50
  ante_chips: 0

rng:
  candidate_coupling: shared      # common random numbers for A/B policy mixing
  reference_coupling: shared      # reference seats reuse draws across A-hand/B-hand
  salts: {chance: 0, candidate: 0, reference: 0}

blocks: 30000
chunk_size: 250

trace:
  rate: 0.001          # ~0.1% of blocks get full PHH traces (deterministic selection)
  include_invalid: true
  block_ids: []

agents:
  # candidates (identical to every FHR3 NLHE config)
  neutral:        {kind: heuristic, style: neutral}
  neutral_copy:   {kind: heuristic, style: neutral}          # identical policy, control
  neutral_loose10: {kind: heuristic, style: neutral, overrides: {looseness: 1.10}}
  tight:          {kind: heuristic, style: tight}
  aggressive:     {kind: heuristic, style: aggressive}
  # reference styles (the cycle entries)
  ref_neutral_a:  {kind: heuristic, style: neutral}
  ref_neutral_b:  {kind: heuristic, style: neutral}
  ref_tight:      {kind: heuristic, style: tight}
  ref_loose:      {kind: heuristic, style: loose}
  ref_aggressive: {kind: heuristic, style: aggressive}

reference_populations:
  # Scheduled: relative slot j of block b gets cycle[(b + j) mod 5] (j = 0 sits immediately
  # after the candidate). Marginal per slot: neutral 40%, tight 20%, loose 20%, aggressive 20%.
  balanced-cycle5-v1:
    cycle: [ref_neutral_a, ref_neutral_b, ref_tight, ref_loose, ref_aggressive]

pairings:
  - pairing_id: p1-neutral-vs-loose10     # small perturbation
    candidate_a: neutral
    candidate_b: neutral_loose10
    reference_population: balanced-cycle5-v1
  - pairing_id: p2-neutral-vs-tight       # moderate style gap
    candidate_a: neutral
    candidate_b: tight
    reference_population: balanced-cycle5-v1
  - pairing_id: p3-aggressive-vs-neutral  # larger style gap, higher variance
    candidate_a: aggressive
    candidate_b: neutral
    reference_population: balanced-cycle5-v1
  - pairing_id: c0-selfplay-control       # must give D == 0 exactly
    candidate_a: neutral
    candidate_b: neutral_copy
    reference_population: balanced-cycle5-v1

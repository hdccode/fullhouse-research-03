  reason: "heads-up-role bug in the FHR3A heuristic family (configs/fhr3b/fields/retired/hu-role-bug/README.md)"
  date: 2026-10-01
  hashes:
    16df070db91a53bd: nlhe6 spread (was frozen)
    a845c2fcf1b2ed33: nlhe6 crowded_cutoff (was frozen)
    5c83ad4268c37bdc: nlhe6 style_diverse (was frozen)
    479125f8aa79e5a6: nlhe6 pool (heuristic)
    e95024951ef40186: nlhe4 spread candidate (never frozen)
    289e4bdb8c9f99bc: nlhe4 crowded_cutoff candidate (never frozen)
    0a9914d3f074b147: nlhe4 style_diverse candidate (never frozen)
    e1d187eb0b4551c2: nlhe4 pool (heuristic)
caveats:
  - "AoF4 style_diverse: style and strength are partly confounded; the strongest pool quintile contains no tight-aggressive bots."
  - "AoF4 crowded_cutoff (and spread top six): leaders are near-identical production-policy variants (D2 accepted); the cutoff cluster itself is strategically diverse."
  - "NLHE: high bust rates are a property of the persistent-stack match rule, not pathology (confirmed after re-calibration)."
  - "NLHE4 style_diverse: observed style is balanced across the selected field, but style is correlated with strength in the underlying corrected NLHE4 pool (eta^2 = 0.28), so style and strength cannot be fully separated in that environment."
  - "All agents are stateless synthetic policies; within-match opponent modelling is under-represented (D5)."

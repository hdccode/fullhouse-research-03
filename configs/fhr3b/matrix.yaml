# FHR3B experiment matrix. Cells are generated from this file (src/fhr3/tournament/experiments.py);
# nothing here is hand-expanded. Replication counts come from presets and are NOT part of any
# cell identity: extending broad -> flagship reuses the same cells and skips finished tournaments.
#
# Locked question: how should FullHouse spend a finite simulation budget so that a Swiss-style
# poker-bot competition reliably identifies the strongest agents? The unit is one complete
# tournament. Research environment: fhr3b_baseline (N=60, K=6, H0=400) with R0=40 as the INITIAL
# horizon, not an assumed sufficient length. These are predeclared research design choices, not
# 2026 FullHouse settings.
lab: lab/lab60_top6.yaml
primary_modes: [aof4, nlhe4, nlhe6]        # PLO removed from FHR3B (plo6.yaml kept only as generic engine support)
all_modes: [aof4, nlhe4, nlhe6, cp6, plo6, bomb6, nit6]

# Rounds-to-reliability checkpoints (Experiment A). The baseline cell runs to its horizon; shorter
# checkpoints are exact prefixes. A horizon beyond 40 (`fhr3b run --horizon 80`) is a new cell whose first
# 40 rounds reproduce the 40-round cell exactly (seeds do not depend on R; `validate --prefix`).
round_checkpoints: [5, 10, 20, 30, 40, 60, 80, 120]

presets:              # tournaments per cell (provisional; revise after the runtime pilot)
  pilot: 8
  broad: 200
  flagship: 1000

calibration:
  pool:               # candidate pool -> field selection (namespace pool-calibration)
    rounds: 2000      # one round = every bot plays one match at a random table
    chunk_rounds: 25
  field_reference:    # mu_field inside each FROZEN field (namespace field-reference): MATCHED evaluation
    match_format: duplicate   # k-lane duplicate matches (4 lanes AoF4/NLHE4, 6 lanes NLHE6)
    rounds: 3000              # ordinary-equivalent rounds; duplicate runs rounds // lanes (equal simulator work)
    chunk_rounds: 25
  behaviour_audit:    # exact replay of the first calibration rounds -> observed style classes
    rounds: 20
  selection:          # src/fhr3/tournament/selection.py (selection v2)
    n: 60
    near_dup: 0.15    # resolved-parameter RMS distance below which two bots count as near-duplicates
    spread: {gap_se: 3.0, strata: 6, leader_archetype_cap: 3, archetype_cap: 10}
    crowded: {n_top: 3, crowd: 12}
    style_diverse: {strata: 5, archetype_cap: 10}

experiments:
  smoke:
    protocol: protocols/smoke.yaml
    modes: [aof4, nlhe4, nlhe6, cp6, plo6, bomb6, nit6]
    fields: [smoke12]
    namespace: smoke
    replicates: 3
  pilot:
    modes: [aof4, nlhe4, nlhe6]
    fields: [provisional60]         # runnable before calibration; use crowded_cutoff once it exists
    namespace: pilot
  baseline:                         # A: horizon cells; checkpoints are read from their round prefixes
    modes: [aof4, nlhe4, nlhe6]
    fields: [spread, crowded_cutoff, style_diverse]
    namespace: publication
  round_sweep:                      # A: derived from baseline (exact prefix identity, verified by `validate --prefix`)
    derived_from: baseline
  budget_sweep:                     # B: fixed R*H, generated from (R0, H0): 10x1600, 20x800, 40x400
    modes: [aof4, nlhe4, nlhe6]
    fields: [crowded_cutoff]
    namespace: publication
  schedule_diagnostic:              # C: frozen-schedule diagnostic of Swiss feedback amplification
    modes: [nlhe6]
    fields: [crowded_cutoff]
    namespace: publication
    replays_per_source: 4           # J (identity); sources = preset / J
  duplicate_play:                   # D: ordinary vs k-lane duplicate matches at EQUAL simulator work (paired seeds)
    status: implemented             # match.DuplicateMatchPlayer; variants from protocol.duplicate_allocations
    modes: [aof4, nlhe4, nlhe6]
    fields: [crowded_cutoff]
    namespace: publication
    lanes: table_size               # 4 (AoF4, NLHE4) / 6 (NLHE6)
  swiss_reference:                  # mu_swiss: expected Swiss performance, separate namespace
    modes: [aof4, nlhe4, nlhe6]
    fields: [spread, crowded_cutoff, style_diverse]
    namespace: swiss-reference
  operational_2026:                 # H: historical validation; blocked until required historical values are supplied
    historical: protocols/historical_2026_reconstruction.yaml
    modes: [nlhe6]

smoke_profile:        # end-to-end correctness run of the whole pipeline (never interpreted)
  fields: [spread, crowded_cutoff, style_diverse]   # selected from the pool into <results>/smoke-fields/
  selection: {n: 12, near_dup: 0.15, crowded: {n_top: 1, crowd: 3},
              spread: {gap_se: 3.0, strata: 2, leader_archetype_cap: 1, archetype_cap: 3},
              style_diverse: {strata: 3, archetype_cap: 3}, replays_per_source: 2}
  calibration:
    pool_field: pool
    pool: {rounds: 6, chunk_rounds: 2}
    field_reference: {rounds: 4, chunk_rounds: 2}

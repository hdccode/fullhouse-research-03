# FHR3 pilot: 6-max Crazy Pineapple, 100BB, fixed mixed reference population.
# 3 hole cards; each live player discards one after the flop betting round
# (before the turn). Same pairing structure as NLHE, cp_heuristic family.
# Same root seed as NLHE but a different deal layout (3 hole cards): not card-matched.
# Scientific fields (experiment_id, root_seed, game, rng, agents used by a
# pairing) are hashed; blocks / chunk_size / trace are operational.
experiment_id: fhr3-cp6-100bb-pilot-v1
root_seed: 20260928

game:
  variant: crazy_pineapple
  player_count: 6
  stack_bb: 100
  bb_chips: 100
  sb_chips: 50
  ante_chips: 0

rng:
  candidate_coupling: shared      # common random numbers for A/B policy mixing
  reference_coupling: shared      # reference seats reuse draws across A-hand/B-hand
  salts: {chance: 0, candidate: 0, reference: 0}

blocks: 10000
chunk_size: 250

trace:
  rate: 0.001          # ~0.1% of blocks get full PHH traces (deterministic selection)
  include_invalid: true
  block_ids: []

agents:
  # candidates
  neutral:        {kind: cp_heuristic, style: neutral}
  neutral_copy:   {kind: cp_heuristic, style: neutral}          # identical policy, control
  neutral_loose10: {kind: cp_heuristic, style: neutral, overrides: {looseness: 1.10}}
  tight:          {kind: cp_heuristic, style: tight}
  aggressive:     {kind: cp_heuristic, style: aggressive}
  # reference seats
  ref_tight:      {kind: cp_heuristic, style: tight}
  ref_neutral_1:  {kind: cp_heuristic, style: neutral}
  ref_loose:      {kind: cp_heuristic, style: loose}
  ref_aggressive: {kind: cp_heuristic, style: aggressive}
  ref_neutral_2:  {kind: cp_heuristic, style: neutral}

reference_populations:
  # Order j = 0..4 : reference j sits j+1 seats after the candidate.
  mixed5-v1: [ref_tight, ref_neutral_1, ref_loose, ref_aggressive, ref_neutral_2]

pairings:
  - pairing_id: p1-neutral-vs-loose10     # small perturbation
    candidate_a: neutral
    candidate_b: neutral_loose10
    reference_population: mixed5-v1
  - pairing_id: p2-neutral-vs-tight       # moderate style gap
    candidate_a: neutral
    candidate_b: tight
    reference_population: mixed5-v1
  - pairing_id: p3-aggressive-vs-neutral  # larger style gap, higher variance
    candidate_a: aggressive
    candidate_b: neutral
    reference_population: mixed5-v1
  - pairing_id: c0-selfplay-control       # must give D == 0 exactly
    candidate_a: neutral
    candidate_b: neutral_copy
    reference_population: mixed5-v1
